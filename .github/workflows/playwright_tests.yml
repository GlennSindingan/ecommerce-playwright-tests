name: Playwright UI E2E Regression Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ui-test-execution:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install framework dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Ensure Playwright browser binaries are installed
      run: |
        pytest -v --html=report.html --self-contained-html || true

    - name: Execute Playwright validation suites
      run: |
        pytest -v

    - name: Upload Test Execution Report Dashboard
      uses: actions/upload-artifact@v4
      with:
        name: playwright-execution-report
        path: report.html